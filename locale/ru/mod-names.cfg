[mod-description]
ArmouredBiters=Добавляет в игру бронированных врагов под названием Щелкуны с собственными спрайтами и анимациями. У них больше здоровья, но они медленнее обычных кусак.
alien-biomes=Коллекция дополнительных биомов: снег, вулканические, кратерные, различные цвета земли, песка и травы. Включает новые варианты деревьев и декоративных элементов. В настройках мода есть управление планетами. При использовании с Space Age затронет только Наувис.
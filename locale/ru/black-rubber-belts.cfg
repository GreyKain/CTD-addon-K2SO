[string-mod-setting-description]
arrow-style-no-arrows=Гладкая резиновая лента. Без стрелок!
arrow-style-arrow=Стрелки в ванильном стиле усеивают конвейеры.
arrow-style-arrow-thick=Более толстые стрелки, покрывающие среднюю часть всей пластины конвейера.
arrow-style-arrow-long=Похоже на толстые стрелки, но на более быстрых конвейерах появляется 2 или 4 стрелки подряд, создавая пунктирную линию.

tier-style-tier-based=Стрелки распределяются по конвейерам в зависимости от уровня каждого конвейера, как в базовой игре.\nКонвейеры <30 ед./с получают обычное расположение.\nКонвейеры >=30 ед./с получают быстрое расположение.\nКонвейеры >=60 ед./с получают турбо-расположение.
tier-style-single=Стрелки расположены близко друг к другу на всех конвейерах, как на обычных ванильных транспортных конвейерах.
tier-style-doubled=Стрелки разнесены на всех конвейерах, как на быстрых или экспресс-конвейерах.
tier-style-quadrupled=Стрелки очень далеко друг от друга на всех конвейерах, как на турбо-конвейерах.

stripe-style-no-stripe=Неокрашенная чёрная резиновая лента.
stripe-style-stripe-thick=Толстая цветная полоса прямо посередине конвейера. Вдохновлено Arrowless Belts.\nСтрелки отображаются инвертированно.
stripe-style-stripe-thin=Тонкая цветная линия прямо посередине конвейера. Вдохновлено Arrowless Belts.
stripe-style-stripe-side=Цветные полосы по бокам конвейера.
stripe-style-full-paint=Весь конвейер окрашен в яркий цвет.\nСтрелки отображаются инвертированно.
stripe-style-prismatic=Весь конвейер тонирован тёмным цветом. Вдохновлено Prismatic Belts.

rail-style-vanilla=Металлический механизм в ванильном стиле для всех конвейеров.
rail-style-ir3-alt=Механизм каждого конвейера имеет особый металлический оттенок в зависимости от металлов IR3 и/или его рецепта крафта.
rail-style-colored=Боковые ограждения каждого конвейера окрашены в зависимости от его уровня. Хорошо сочетается со стилем стрелок «без стрелок»!
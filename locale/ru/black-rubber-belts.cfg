[mod-name]
black-rubber-belts-remastered=Чёрные резиновые конвейеры — Переиздание

[mod-description]
black-rubber-belts-remastered=Перекрашивает ванильные конвейеры в тёмный резиновый стиль. Только косметические изменения.\nТеперь обновлено для 2.0/2.1, с опциями совместимости!\n\nВся заслуга принадлежит автору оригинального мода — Deadlock989. Я лишь перезаливаю и обновляю мод для 2.0/2.1.\n\nDeadlock989, если вы это читаете, пожалуйста, свяжитесь со мной по поводу дальнейшего существования этого порта/обновления.

[mod-setting-name]
arrow-style=Стиль стрелок на конвейере
tier-style=Расположение стрелок на конвейере
stripe-style=Стиль полос на конвейере
rail-style=Стиль боковых ограждений конвейера

arrow-glow=Светящиеся стрелки
stripe-glow=Светящиеся полосы
rail-glow=Светящиеся ограждения

rb-visualization=Индикатор направления конвейера

[mod-setting-description]
arrow-style=Изменяет стиль цветных стрелок, добавляемых на конвейеры, или их наличие вообще. (По умолчанию: Обычные стрелки)
tier-style=Изменяет расстояние между стрелками на конвейерах и то, должно ли оно зависеть от уровня конвейера или быть одинаковым для всех конвейеров. (По умолчанию: В зависимости от уровня)
stripe-style=Изменяет стиль цветной полосы, наносимой на конвейеры. Может перекрываться со стрелками. (По умолчанию: Без полосы)
rail-style=Изменяет стиль механических частей по бокам конвейеров. (По умолчанию: Ванильные ограждения)

arrow-glow=Если включено, стрелки на конвейере будут светиться в темноте.
stripe-glow=Если включено, нанесённые полосы на конвейере будут светиться в темноте.
rail-glow=Если включено, боковые ограждения конвейеров будут светиться в темноте. Работает только с активным «цветными ограждениями»!

rb-visualization=Если включено, маленькая стрелка будет указывать, в каком направлении обращён конвейер в курсоре, для удобства строительства.


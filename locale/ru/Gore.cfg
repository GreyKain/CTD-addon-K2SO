[mod-setting-description]
gore-preset=Различные пресеты для цвета крови\nИспользуйте «custom», чтобы настроить свои цвета крови\nПресет custom/automatic попытается подобрать остальные цвета на основе выбранного вами цвета декалей
gore-fx_color=Цвет анимированных взрывов крови
gore-decal_color=Цвет декалей на полу и трупах
gore-particle_color=Цвет частиц крови (при получении урона и смерти)
gore-guts_color=Цвет частиц внутренностей
gore-corpse_blood_color=Цвет крови на трупах (не работает с «rainbow»)
gore-scale=Масштаб анимированного эффекта брызг крови
gore-splatterscale=Масштаб декалей на полу
gore-splatterduration=Время до исчезновения декалей на полу
gore-particleduration=Время до исчезновения частиц (при получении урона)\n(частицы при смерти будут держаться на 1 секунду дольше, чем лужа крови. (независимо от того, отключена ли она))
gore-puddleduration=Под телом есть небольшая лужа крови с 0.17\nВаниль: 50
gore-bodyduration=Сколько времени требуется, чтобы труп исчез\nВаниль: 900
gore-bodyspray=Хотите ли вы, чтобы кровь наносилась и на тела
gore-hide_puddle=Скрывает эффект, когда трупы медленно истекают кровью
gore-change_guts=Пользовательская графика внутренностей для лучшего соответствия цвету вашей крови
gore-guts_mult=Количество, 0-3
gore-custom_splashes=Включает гиф-подобные взрывы крови при смерти юнита.
gore-custom_decals=Включает наземные декали при смерти юнита.
gore-puddle-d=Цвет лужи основан на стандартных настройках RGB.\nЭто значение умножает её яркость (Все пресеты используют 0.9)
gore-armoured_bleed=Юниты из мода «ArmouredBiters»

